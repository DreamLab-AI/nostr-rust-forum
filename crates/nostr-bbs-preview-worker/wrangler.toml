name = "nostr-bbs-link-preview"
main = "build/worker/shim.mjs"
compatibility_date = "2025-09-01"

[build]
command = "worker-build --release"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c56bfb95f0984b3a8822866b094f3a61"

[vars]
ALLOWED_ORIGIN = "https://example.com"
# Egress allow-list: the only hosts /preview and /ascii will fetch (comma or
# whitespace separated; an entry also matches its subdomains). Required: when
# unset or blank the worker fails closed and both routes answer 503, because the
# Workers runtime cannot pin resolved IPs and a denylist alone is open to DNS
# rebinding. List the sites your members link to; unlisted hosts get no preview.
# Twitter/X previews fetch publish.twitter.com, which `twitter.com` covers.
# Redirect hops are checked too, so list both ends (youtu.be -> youtube.com).
PREVIEW_ALLOWED_HOSTS = "example.com, wikipedia.org, github.com, youtube.com, youtu.be, twitter.com, x.com"
# Local development only: PREVIEW_ALLOW_ANY_HOST = "true" with no allow-list
# falls back to the denylist alone. Never set it on an internet-facing worker.
# Images on the deployment's own Workers (the pod Worker on the same
# *.workers.dev subdomain or zone) cannot be fetched over the internet from
# here: the runtime answers a Worker-to-Worker fetch on the same zone with an
# error page (Cloudflare error 1042), which /ascii reports as "upstream
# answered HTTP …". Bind each such Worker and map its host to the binding;
# the host must still be on PREVIEW_ALLOWED_HOSTS. Example:
# PREVIEW_SERVICE_BINDINGS = "pods.example.workers.dev=POD_API"
#
# [[services]]
# binding = "POD_API"
# service = "nostr-bbs-pod-api"
