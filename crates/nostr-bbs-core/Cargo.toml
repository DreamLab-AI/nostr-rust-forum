[package]
name = "nostr-bbs-core"
version = "1.0.0-beta.19"
edition = "2021"
description = "nostr-bbs community forum — core types"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreamLab-AI/nostr-rust-forum"
homepage = "https://github.com/DreamLab-AI/nostr-rust-forum"
documentation = "https://docs.rs/nostr-bbs-core"
readme = "README.md"
keywords = ["nostr", "bbs", "forum", "nip04", "nip44"]
categories = ["cryptography", "web-programming"]
rust-version = "1.85"

[lib]
crate-type = ["lib", "cdylib"]
# No `#[bench]` fns live in the lib — benchmarks are criterion targets below.
# Without this, `cargo bench -- <criterion args>` runs the libtest unittest
# target first and dies on "Unrecognized option: warm-up-time" before any
# benchmark executes, which silently empties the dream-cycle perf evaluator.
bench = false

[features]
default = []
# DID:nostr document rendering. Pulls `solid-pod-rs`, which is AGPL-3.0-only:
# a build with this feature on is AGPL as a whole. Off by default so the
# default crate is MIT OR Apache-2.0 end to end.
did = ["dep:solid-pod-rs"]

[dependencies]
nostr = { workspace = true }
k256 = { workspace = true }
chacha20poly1305 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
bech32 = { workspace = true }
async-trait = { workspace = true }
# Canonical did:nostr types + payments (upstream).
solid-pod-rs = { workspace = true, optional = true }

wasm-bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
serde-wasm-bindgen = "0.6"
# k256/crypto-bigint 0.14 pull getrandom 0.4 (the 0.2 line above is a separate
# semver-incompatible crate). On wasm32-unknown-unknown 0.4 refuses to compile
# unless `wasm_js` is on; it then routes to crypto.getRandomValues. Core is in
# every wasm crate's k256 graph, so cargo feature unification covers them all.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

# proptest + criterion use native-only deps (rusty-fork → wait-timeout)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
rusqlite = { workspace = true }

[[bench]]
name = "bench_nip44"
harness = false

[[bench]]
name = "bench_keys"
harness = false

[[bench]]
name = "bench_events"
harness = false

[[bench]]
name = "bench_threads"
harness = false
