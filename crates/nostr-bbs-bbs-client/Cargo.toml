[package]
name = "nostr-bbs-bbs-client"
version = "1.0.0-beta.10"
publish = false           # deployable application (built from source at KIT_REF), not a crates.io dependency
edition = "2021"
description = "nostr-bbs community forum — re-imagined retro TUI/BBS terminal client (Leptos CSR/WASM)"
license = "AGPL-3.0-only"
repository = "https://github.com/DreamLab-AI/nostr-rust-forum"
keywords = ["nostr", "bbs", "ascii", "tui", "leptos", "wasm"]
categories = ["web-programming", "wasm"]
rust-version = "1.85"

# Pure logic (config/theme/router/prefs/pod/pwa/ascii) lives in the lib so it is
# unit-testable on the native target; `main.rs` mounts the Leptos app for wasm.
[lib]
name = "nostr_bbs_bbs_client"
path = "src/lib.rs"

[[bin]]
name = "nostr-bbs-bbs-client"
path = "src/main.rs"

[dependencies]
# Shared headless client engine (relay, auth, encrypted zones, DMs, stores,
# poker, wallet, sealed search, pod client) — prevents drift with forum-client.
nostr-bbs-client-core = { workspace = true }
# Shared config schema (Branding, Zone, ZoneVisibility).
nostr-bbs-config = { workspace = true }
# Kit core: event types, governance, kanban, calendar, sealed originals, signer.
nostr-bbs-core = { workspace = true, features = ["did"] }
# Poker engine types & rules (shared with poker-citizen and forum-client).
nostr-bbs-poker = { workspace = true }
# Solid pod / WebID / did:nostr URL formatting.
solid-pod-rs = { workspace = true }
# Colloquy shared-agent-learning knowledge board (ADR-2085/2086).
colloquy-core = "0.1"
colloquy-nostr = "0.2"
colloquy-view = "0.1"

leptos = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
comrak = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
web-sys = { workspace = true, features = [
    "Window",
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "Event",
    "CustomEvent",
    "EventTarget",
    "HashChangeEvent",
    "KeyboardEvent",
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItemList",
    "DataTransferItem",
    "Location",
    "History",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Storage",
    "StorageEvent",
    "MediaQueryList",
    "DomTokenList",
    "DomRect",
    "ResizeObserver",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "AesKeyGenParams",
    "AesGcmParams",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "UrlSearchParams",
    "Url",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "File",
    "FileList",
    "Blob",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageBitmap",
    "Navigator",
    "CredentialsContainer",
    "CredentialCreationOptions",
    "CredentialRequestOptions",
    "PublicKeyCredential",
    "PublicKeyCredentialCreationOptions",
    "PublicKeyCredentialRequestOptions",
    "AuthenticatorResponse",
    "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "AuthenticationExtensionsClientInputs",
    "AuthenticationExtensionsClientOutputs",
] }
console_error_panic_hook = "0.1"
hex = { workspace = true }
zeroize = { workspace = true }
gloo = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
send_wrapper = "0.6"
url = { workspace = true }
async-trait = { workspace = true }
