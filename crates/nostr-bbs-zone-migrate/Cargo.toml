[package]
name = "nostr-bbs-zone-migrate"
version = "1.0.0-beta.11"
edition = "2021"
description = "Operator CLI that seals the plaintext history of an encrypted nostr-bbs zone into sealed-original envelopes and then purges the plaintext (ADR-2017)"
license = "AGPL-3.0-only"
repository = "https://github.com/DreamLab-AI/nostr-rust-forum"
homepage = "https://github.com/DreamLab-AI/nostr-rust-forum"
documentation = "https://docs.rs/nostr-bbs-zone-migrate"
keywords = ["nostr", "bbs", "nip44", "migration", "encryption"]
categories = ["command-line-utilities", "cryptography"]
readme = "README.md"
rust-version = "1.85"
# Project-specific operator tool for a kit deployment; not a reusable library.
publish = false

[lib]
# The planner, state model, key handling and seal/verify/purge engine are pure
# and compile to wasm32 (kit CI checks every member for wasm32).
path = "src/lib.rs"

[[bin]]
name = "nostr-bbs-zone-migrate"
path = "src/main.rs"

[dependencies]
nostr-bbs-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# Network client and CLI: native only, so the wasm32 check sees a pure library.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
