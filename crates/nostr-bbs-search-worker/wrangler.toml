name = "nostr-bbs-search-api"
main = "build/worker/shim.mjs"
compatibility_date = "2025-09-01"

[build]
command = "worker-build --release"

# Cloudflare Workers AI binding. Powers semantic embeddings via
# @cf/baai/bge-small-en-v1.5 (384-dim, matches the store DIM). When this
# binding is absent the worker falls back to deterministic hash embeddings.
[ai]
binding = "AI"

[[r2_buckets]]
binding = "VECTORS"
bucket_name = "nostr-bbs-vectors"

[[kv_namespaces]]
binding = "SEARCH_CONFIG"
id = "440b1f07ff224fb8ad644e094c6766c0"

# D1 database for NIP-98 replay protection (atomic INSERT OR IGNORE).
# Shares the auth-worker's D1 database so cross-worker replay is detected.
[[d1_databases]]
binding = "REPLAY_DB"
database_name = "nostr-bbs-auth"
database_id = "e3981999-e8f0-4c07-9e4b-2e50859b8524"

[vars]

# System One advisory integration. Errors retain the existing result.
JEV_SEARCH_RERANK = "1"
JEV_ENDPOINT = "https://api.subq.ai/v1/systemone"
JEV_MODEL = "subq-snap-preview"
JEV_API_KEY_NAME = "SUBQ_API_KEY"
# Supply SUBQ_API_KEY as a Worker secret; never put its value in this file.

ALLOWED_ORIGIN = "https://example.com"
ALLOWED_ORIGINS = "https://example.com"
RVF_STORE_KEY = "nostr-bbs.rvf"
ADMIN_PUBKEYS = "11ed64225dd5e2c5e18f61ad43d5ad9272d08739d3a20dd25886197b0738663c"

[triggers]
crons = ["*/5 * * * *"]
