[package]
name = "nostr-bbs-forum-client"
version = "1.0.0-beta.10"
publish = false           # deployable application (built from source at KIT_REF), not a crates.io dependency
edition = "2021"
description = "nostr-bbs community forum — web client"
license = "AGPL-3.0-only"
repository = "https://github.com/DreamLab-AI/nostr-rust-forum"
homepage = "https://github.com/DreamLab-AI/nostr-rust-forum"
documentation = "https://docs.rs/nostr-bbs-forum-client"
keywords = ["nostr", "bbs", "leptos", "wasm", "forum"]
categories = ["web-programming", "wasm"]
rust-version = "1.85"

[[bin]]
name = "nostr-bbs-forum-client"
path = "src/main.rs"

[features]
default = []
dev-auth = []

[dependencies]
nostr-bbs-core = { workspace = true }
# `solid-pod-rs` core feature — wasm32-safe pure-logic surface. Exposes
# `did_nostr_types::{NostrPubkey, did_nostr_uri}` plus the `webid` and
# `interop` modules. Used by signup wizard + pod-browser + settings to
# avoid duplicating WebID / pod URL / NIP-05 formatting across the client.
solid-pod-rs = { workspace = true }
# Colloquy — cq shared-agent-learning knowledge units (agentbox ADR-2085).
# Both crates depend on colloquy-core and nothing else of ours, so neither drags
# a Nostr binding or a store into the WASM bundle. They are published, so these
# are registry deps and this repo has NO path edge into agentbox — the forum
# builds from a clean checkout with nothing beside it.
colloquy-core = "0.1"
colloquy-nostr = "0.2"
colloquy-view = "0.1"
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Element",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "EventTarget",
    "Location",
    "Navigator",
    "CredentialsContainer",
    "PublicKeyCredential",
    "PublicKeyCredentialCreationOptions",
    "PublicKeyCredentialRequestOptions",
    "AuthenticatorResponse",
    "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "CredentialCreationOptions",
    "CredentialRequestOptions",
    "AuthenticationExtensionsClientInputs",
    "AuthenticationExtensionsClientOutputs",
    "Storage",
    # Cross-tab notification read-state sync: the `storage` event (fired only in
    # OTHER same-origin tabs when one writes localStorage) carries the changed key.
    "StorageEvent",
    "HtmlDocument",
    "Headers",
    "RequestInit",
    # The wallet fetches the mirror's block file with the cache bypassed.
    "RequestCache",
    "Request",
    "Response",
    "PageTransitionEvent",
    "DomRect",
    "MediaQueryList",
    "KeyboardEvent",
    "CssStyleDeclaration",
    "HtmlTextAreaElement",
    "HtmlIFrameElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "FileReader",
    "File",
    "FileList",
    "DataTransfer",
    "DragEvent",
    "Blob",
    "ScrollToOptions",
    "Event",
    "Clipboard",
    # IndexedDB (offline-first persistence)
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbIndex",
    "IdbKeyRange",
    "IdbCursorDirection",
    "DomStringList",
    # Storage quota
    "StorageManager",
    # Service worker registration
    "ServiceWorkerContainer",
    "RegistrationOptions",
    "ServiceWorkerUpdateViaCache",
    # Pointer events (swipe gestures)
    "PointerEvent",
    # NodeList (focus trap)
    "NodeList",
    # Image compression + encrypted media
    "ImageBitmap",
    "BlobPropertyBag",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "Url",
    # /connect magic-link: strip the nsec-bearing fragment from history on mount (ADR-098)
    "History",
] }
gloo = { workspace = true }
comrak = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
k256 = { workspace = true }
send_wrapper = "0.6"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
bech32 = { workspace = true }
# Pure-Rust QR generator (no_std-friendly, wasm32-clean). Renders QR codes to
# SVG strings entirely in-WASM so the nsec never crosses into JS (ADR-095).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
async-trait = { workspace = true }
uuid = { version = "1", features = ["js"] }
# Member wallets on sidestr:dreamlab (testnet4) and DREAM tips (ADR-2015).
# The published sidestr-rs crates, pure halves only: the agent library
# without its CLI builds for wasm32, so the browser validates the chain and
# signs spends with the same code an agent runs. secp256k1's C builds with
# clang for wasm32 (the CI runners carry it).
sidestr-agent = { version = "0.3", default-features = false }
sidestr-core = "0.3.1"
sidestr-wallet = "0.4"
sidestr-nostr = "0.3"
# `secp-lowmemory`: libsecp256k1 with small precomputed tables. Signing a
# tip is one Schnorr signature and a replay verifies a few hundred, so the
# speed the full tables buy is not worth their ~1 MB in every page load.
bitcoin = { version = "0.32", features = ["secp-lowmemory"] }
