<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <!-- Content Security Policy, meta form: GitHub Pages cannot send response
         headers. Deliberately no script-src: Trunk injects an inline loader
         whose hash changes every build, and the deploy step rewrites the
         window.__ENV__ block below, so a script hash list cannot be kept
         honest here. object-src and base-uri close the plugin-injection and
         <base>-hijack routes that need no script at all; form-action keeps a
         future form from posting the session elsewhere. frame-ancestors is
         header-only and cannot be set from a meta tag. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nostr-bbs</title>
    <meta name="description" content="A fast, decentralized, Nostr-powered forum" />
    <meta name="theme-color" content="#111827" />

    <!-- GitHub Pages SPA deep-link restore: picks up redirect from root 404.html.
         __p is attacker-controllable, so the target is resolved by the URL
         parser (which normalises dot segments, %2e%2e and backslashes) and
         kept only when it is same-origin and inside /community/. Anything else
         falls back to /community/. __p is stripped either way, so an older
         unvalidated copy of this pickup injected later by an operator site
         finds nothing to act on. Tested by tests/deep-link.test.mjs. -->
    <script>
        (function(){
            var loc = window.location;
            var q = new URLSearchParams(loc.search);
            var redirect = q.get('__p');
            if (redirect === null) return;
            q.delete('__p');
            var qs = q.toString();
            var tail = (qs ? '?' + qs : '') + loc.hash;
            var base = '/community';
            var target = base + '/' + tail;
            if (redirect.charAt(0) === '/') {
                try {
                    var u = new URL(base + redirect + tail, loc.origin);
                    if (u.origin === loc.origin &&
                        (u.pathname === base || u.pathname.indexOf(base + '/') === 0)) {
                        target = u.pathname + u.search + u.hash;
                    }
                } catch (e) { /* unparseable: keep the fallback */ }
            }
            history.replaceState(null, '', target);
        })();
    </script>

    <!-- Sign-in link capture (utils/connect_link.rs). A sheet QR opens
         <base>/#k=<nsec>. Scrub anything key-like from the address bar and
         the current history entry NOW, before the multi-megabyte WASM bundle
         downloads, and hand the raw fragment to the app through a one-shot,
         non-enumerable getter that returns it once and deletes itself. The
         app validates it and imports only on <base>/ or <base>/connect.
         Logs nothing. A unit test keeps this rule in sync with Rust. -->
    <script>
        (function(){
            var h = window.location.hash;
            if (!(h.slice(0, 3) === '#k=' || h.indexOf('nsec1') !== -1)) return;
            history.replaceState(null, '', window.location.pathname + window.location.search);
            var raw = h;
            h = null;
            Object.defineProperty(window, '__nbbsTakeConnectKey', {
                configurable: true,
                enumerable: false,
                value: function () {
                    var k = raw;
                    raw = null;
                    delete window.__nbbsTakeConnectKey;
                    return k;
                }
            });
        })();
    </script>

    <!-- Favicon + PWA marks.
         Single source of truth: assets/icons/icon.svg (rasters generated by
         scripts/gen-pwa-icons.sh). The tab favicon, the iOS home-screen icon,
         and the manifest icons are now THE SAME MARK, which is the point —
         the previous build used an inline amber-diamond data-URI for the tab
         but pointed the manifest at the retro BBS client's black terminal
         icon, so the installed app was unidentifiable on a home screen. -->
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />

    <!-- Inter, self-hosted: the @font-face lives in style.css. Never load it
         from a font CDN; every such request hands the visitor's IP to a third
         party. The OFL licence travels with the font into dist. No preload
         link: a relative href here would resolve against the restored
         deep-link path, whereas the stylesheet's url() resolves against the
         stylesheet's own (public-url) location. -->
    <link data-trunk rel="copy-dir" href="assets/fonts" data-target-path="fonts" />

    <!-- Tailwind utilities (tree-shaken at build time by Tailwind CLI v3.4.17,
         driven by Trunk pre_build hook in Trunk.toml). Replaces the legacy
         cdn.tailwindcss.com Play CDN — Chrome flags that as dev-only and it
         shipped ~3MB of unused CSS to every visitor. The pre_build hook scans
         src/**/*.rs (Leptos view! macros) plus index.html and emits a
         minified tailwind.dist.css. Config: tailwind.config.js. -->
    <link data-trunk rel="css" href="tailwind.dist.css" />

    <!-- Shared design tokens (same source as React marketing site) -->
    <link data-trunk rel="css" href="design-tokens.css" />
    <!-- Forum-specific styles (imports design-tokens.css for @import fallback) -->
    <link data-trunk rel="css" href="style.css" />

    <!-- Runtime config placeholder — DO NOT commit real endpoints, admin keys,
         or branding here.
         The deploy pipeline REPLACES this entire <script> block with the
         operator's real `window.__ENV__` (relay/auth/pod/search endpoints,
         zones, branding, build metadata). It is intentionally empty in the kit
         so an un-injected build (local Trunk, or CI without the deploy step)
         falls back to the client's own safe defaults — the production relay,
         a brand-neutral forum name, the legacy zone list, and "dev"/"local"
         build strings — rather than shipping any operator- or dev-specific
         endpoints that are unreachable off the dev box. -->
    <script>
    window.__ENV__ = window.__ENV__ || {};
    </script>

    <!-- Trunk WASM bundle injection (workspace: specify package + binary).
         data-wasm-opt="0" disables Trunk's bundled wasm-opt 122 which rejects
         Rust 1.90's bulk-memory ops. We run a manually-installed binaryen 119
         in a post_build Trunk hook instead — see Trunk.toml. -->
    <link data-trunk rel="rust" data-wasm-opt="0" data-cargo-package="nostr-bbs-forum-client" data-bin="nostr-bbs-forum-client" />

    <!-- Service worker copied to dist/community/sw.js so main.rs's
         navigator.serviceWorker.register('./sw.js') resolves at runtime.
         Trunk's correct asset-copy directive is rel="copy-file"; the [[copy]]
         table in Trunk.toml is silently ignored. -->
    <link data-trunk rel="copy-file" href="sw.js" />

    <!-- PWA manifest: installs the MAIN forum interface as the home-screen app
         (scope /community/, one-shot boot via ?pwa=1). Copied verbatim so the
         relative href resolves at the served base; the deploy re-brands
         name/short_name. The retro BBS keeps its own nested-scope manifest at
         /community/bbs/ for those who prefer that interface. -->
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- The forum's own icon set. Previously the manifest borrowed
         /community/bbs/icons/* — the RETRO BBS client's icons — which made the
         installed forum PWA look identical to the BBS PWA (and broke outright
         if the operator deployed the forum without the bbs sub-app). These are
         relative to the manifest's scope so they resolve wherever the kit is
         served from. -->
    <link data-trunk rel="copy-dir" href="assets/icons" data-target-path="icons" />

    <!-- The 3D poker table (src/components/table3d.rs), copied verbatim and
         loaded only when a member switches the 3D table on: the wasm-bindgen
         snippet js/table3d.js dynamic-imports <public-url>/table3d/index.js,
         which imports three.js from <public-url>/vendor/three-<version>/ by
         relative path. No <base href> is involved, so both resolve from the
         modules' own URLs on every route. See js/table3d/README.md. -->
    <link data-trunk rel="copy-dir" href="js/table3d" data-target-path="table3d" />
    <link data-trunk rel="copy-dir" href="assets/vendor" data-target-path="vendor" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Forum" />
    <!-- iOS ignores the manifest's icons entirely and ignores SVG touch icons;
         without this link it screenshots the page for the home-screen tile. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Dark chrome behind the notch, matching theme_color and the app's own
         dark-first surface (rather than iOS's default opaque white bar). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
    <!-- Loading screen — replaced by Leptos mount_to_body() -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-ring"></div>
        <h1 class="loading-logo gradient-text">nostr-bbs</h1>
        <p class="loading-status">Initializing&hellip;</p>
    </div>

    <noscript>This application requires JavaScript and WebAssembly.</noscript>
</body>
</html>
