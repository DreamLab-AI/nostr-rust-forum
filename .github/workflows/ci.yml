# CI pipeline for nostr-rust-forum (nostr-bbs-rs kit)
#
# Jobs:
#   fmt       — cargo fmt --check (hard gate)
#   clippy    — cargo clippy -D warnings (hard gate)
#   test      — cargo test --workspace --all-targets --all-features (hard gate)
#   test-security — hard gate: security-critical crate suites (crypto, relay
#               read-gating, WAC/ACL, NIP-98 replay, SSRF, config)
#   wasm      — cargo check --target wasm32-unknown-unknown (portable crates, hard gate)
#   doc       — cargo doc --no-deps (catch broken links)
#   coverage  — measured workspace line/branch/function coverage (hard gate)
#   deny      — cargo-deny licence/advisory/ban/source policy
#   drift-gates — identity-vector parity (hard) + anti-drift lint (advisory, ER-5b)
#   ci-pass   — single required status check aggregator
#
# Separate audit.yml handles weekly RustSec advisory scans.

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/nostr-bbs-forum-client/js/**'
      - 'crates/nostr-bbs-forum-client/tools/**'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'forum.toml'
      - 'scripts/validate-forum-config.sh'
      - 'scripts/anti-drift-lint.sh'
      - 'scripts/identity-vector-parity.mjs'
      - 'crates/nostr-bbs-core/tests/vectors/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/nostr-bbs-forum-client/js/**'
      - 'crates/nostr-bbs-forum-client/tools/**'
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'forum.toml'
      - 'scripts/validate-forum-config.sh'
      - 'scripts/anti-drift-lint.sh'
      - 'scripts/identity-vector-parity.mjs'
      - 'crates/nostr-bbs-core/tests/vectors/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Format check — fast, no dependencies needed
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Clippy — lint the entire workspace with -D warnings (blocking)
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Test — run the full workspace test suite on native target
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: cargo test --workspace --all-targets --all-features
        run: cargo test --workspace --all-targets --all-features

      - name: 3D poker table (node, recorded hands)
        run: node crates/nostr-bbs-forum-client/tools/table3d-test.mjs

      - name: Validate configuration contract
        run: |
          bash scripts/validate-forum-config.sh forum.example.toml
          if [[ -f forum.toml ]]; then
            bash scripts/validate-forum-config.sh forum.toml
          fi

  # ---------------------------------------------------------------------------
  # Test (security) — HARD GATE for the security-critical crates.
  #
  # The full-workspace `test` job above is required. This focused job also runs
  # the test suites that cover the security controls
  # (crypto/signature verification, relay zone/COUNT read-gating, WAC/ACL,
  # NIP-98 replay, SSRF guard, config validation) and DOES gate merges, so a
  # regression in those controls fails CI instead of slipping through.
  # ---------------------------------------------------------------------------
  test-security:
    name: test (security crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: test-security

      - name: cargo test (security-critical crates)
        run: |
          cargo test \
            -p nostr-bbs-core \
            -p nostr-bbs-relay-worker \
            -p nostr-bbs-pod-worker \
            -p nostr-bbs-auth-worker \
            -p nostr-bbs-preview-worker \
            -p nostr-bbs-config

  # ---------------------------------------------------------------------------
  # WASM check — verify portable crates compile for wasm32-unknown-unknown
  #
  # Most crates in this workspace target wasm32 (CF Workers, Leptos CSR).
  # Some pull in secp256k1-sys which requires C compilation with 32-bit
  # stubs; on GitHub Actions ubuntu-latest this works if libc6-dev-i386 is
  # installed. We install it and check the full workspace.
  #
  # If specific crates break, switch to per-crate checks:
  #   cargo check --target wasm32-unknown-unknown -p nostr-bbs-config
  #   cargo check --target wasm32-unknown-unknown -p nostr-bbs-preview-worker
  #   ... etc
  # ---------------------------------------------------------------------------
  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wasm32

      - name: Install 32-bit libc headers (for secp256k1-sys cross-compile)
        run: sudo apt-get update && sudo apt-get install -y libc6-dev-i386

      - name: cargo check --workspace --target wasm32-unknown-unknown
        run: cargo check --workspace --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------
  # Doc — catch broken intra-doc links and missing docs
  # ---------------------------------------------------------------------------
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: doc

      - name: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken-intra-doc-links"
        run: cargo doc --workspace --no-deps

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@b3c2424e62a3f08fd88bf434799847a4d0da36c8

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: coverage

      - name: Measure workspace coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-lcov
          path: lcov.info

  # ---------------------------------------------------------------------------
  # cargo-deny — licence policy, advisories, bans, sources
  # Requires deny.toml at the workspace root.
  # ---------------------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: deny

      # Install cargo-deny directly with the host toolchain instead of the
      # EmbarkStudios action, whose musl toolchain bootstrap was failing in CI
      # (infra, not policy). This makes the supply-chain check reliable enough to
      # gate merges so a new advisory/licence/source violation blocks the PR.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  # ---------------------------------------------------------------------------
  # Drift gates (TODO-unified ER-5b) — both scripts were in no workflow.
  #
  #   identity-vector-parity — ADR-2003 JavaScript half of the shared identity
  #       sub-key vectors. Node-only, no npm dependencies. agentbox is checked
  #       out read-only so the mirrored derivation is pinned to the real call
  #       sites; without it the script still runs the vectors and says so.
  #   anti-drift-lint — ADR-077 P3 / ADR-085 lint. Rules 1-2 are clean today;
  #       rule 3 (branded operator strings) currently reports the sidestr:dreamlab
  #       chain ids and wallet copy. Until those are moved into the forum-config
  #       overlay or the rule is scoped to exempt chain ids, the lint step is
  #       advisory (continue-on-error) so it surfaces the findings without
  #       turning main red. Remove continue-on-error once it exits 0.
  #
  # Not in the ci-pass aggregator's needs: the parity step is the only hard
  # failure here, and this job is deliberately cheap (no Rust toolchain).
  # ---------------------------------------------------------------------------
  drift-gates:
    name: drift gates (lint + identity-vector parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DreamLab-AI/agentbox
          path: _agentbox

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Identity-vector parity (ADR-2003)
        env:
          AGENTBOX_ROOT: ${{ github.workspace }}/_agentbox
        run: node scripts/identity-vector-parity.mjs

      - name: Anti-drift lint (advisory until rule 3 is clean)
        continue-on-error: true
        run: bash scripts/anti-drift-lint.sh

  # ---------------------------------------------------------------------------
  # Aggregator — single required status check for branch protection.
  # Point GitHub branch protection at this job name: "CI required".
  # ---------------------------------------------------------------------------
  ci-pass:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - test-security
      - wasm
      - doc
      - coverage
      - deny
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "fmt:           ${{ needs.fmt.result }}"
          echo "clippy:        ${{ needs.clippy.result }}"
          echo "test:          ${{ needs.test.result }}"
          echo "test-security: ${{ needs.test-security.result }}"
          echo "wasm:          ${{ needs.wasm.result }}"
          echo "doc:           ${{ needs.doc.result }}"
          echo "coverage:      ${{ needs.coverage.result }}"
          echo "deny:          ${{ needs.deny.result }}"

          # Every listed quality and security job is a hard merge gate.
          for result in \
            "${{ needs.fmt.result }}" \
            "${{ needs.clippy.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.wasm.result }}" \
            "${{ needs.test-security.result }}" \
            "${{ needs.doc.result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs.deny.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not succeed."
              exit 1
            fi
          done
          echo "All required CI gates passed."
