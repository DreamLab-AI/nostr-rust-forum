# Weekly RustSec advisory scan for nostr-rust-forum
#
# Runs on a schedule (Monday 06:17 UTC) and on-demand via workflow_dispatch.
# Also runs on push/PR when Cargo.lock changes (dependency update).
#
# Separate from CI to avoid slowing down the main pipeline — cargo-audit
# fetches the advisory DB on every run.

name: Security Audit

on:
  schedule:
    # Weekly: Monday 06:17 UTC (avoid the :00 stampede)
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - 'scripts/security-audit.sh'
      - 'scripts/ci/dep-watchlist.*'
      - 'docs/security/advisory-exceptions.md'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - 'scripts/security-audit.sh'
      - 'scripts/ci/dep-watchlist.*'
      - 'docs/security/advisory-exceptions.md'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      # Same cache key as the ci.yml `deny` job so the cargo-deny build is reused.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: deny

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: bash scripts/security-audit.sh

      # The advisory DB is fetched live, so an unchanged lockfile can go red
      # (e.g. 2026-10-14: rustls 0.23.45, quinn-proto 0.11.15). Running the same
      # check as ci.yml on the weekly schedule surfaces drift before release.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny check advisories
        run: cargo deny check advisories

      # Informational: locked vs latest crates.io version of watched crates.
      - name: Dependency watch list
        continue-on-error: true
        run: bash scripts/ci/dep-watchlist.sh
